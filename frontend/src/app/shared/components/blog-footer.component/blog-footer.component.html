<div class="blog-footer">
    <span class="d-flex gap-2" (click)="handleReact()">
        @if (!blog()?.like) {
        <i class="bi bi-heart"></i>
        } @else {
        <i class="bi bi-heart-fill"></i>
        }
        <span class="nb-likes">{{ blog()?.like_count
            }}</span></span>
    <form class="comment" [formGroup]="commentForm" (ngSubmit)="handleCommentSubmit()">
        <input formControlName="content" type="text" placeholder="Comment...">
    </form>
</div>
