            <li>Dashboard</li>
        </ul>
        <div class="end d-flex align-items-center gap-4">

            <input type="search" placeholder="Search...">
            <div class="profile">
                <button (click)="dropdownProfile($event)">
                    <i class="bi bi-person-fill"></i>
                    <div class="arrow">
                        @if (!showDropdown()) {
                        <i class="bi bi-arrow-down-short"></i>
                        } @else {
                        <i class="bi bi-arrow-up-short"></i>
                        }
                    </div>
                    @if (showDropdown()) {
                    <div class="dropdownSection shadow">
                        <p class="username">{{ userInfos()?.username }}</p>

                        <div class="divider"></div>

                        <button class="logout-btn text-danger" (click)="logout()">
                            Logout
                        </button>
                    </div>
                    }
                </button>
            </div>
        </div>
    </nav>
</header>
