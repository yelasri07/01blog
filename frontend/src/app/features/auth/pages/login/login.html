<div class="row w-100 h-100">
    <section class="img-section col h-100">
        <!-- <img class="w-100 h-100" src="/assets/images/office.jpg"> -->
    </section>
    <section class="form-section col d-flex flex-column justify-content-center align-items-center">
        <div class="text">
            <h2 class="mb-2">Log into your account</h2>
            <app-welcome-message />
        </div>
        <form class="d-flex flex-column gap-4">
            <input class="border" type="text" placeholder="Username">
            <input class="border col" type="password" placeholder="Password">
            <button class="btn btn-dark" type="submit">Sign in</button>
            <p class="text-muted">Don't have an account? <a class="text-decoration-none" routerLink="/auth/register">Sign up</a></p>
        </form>
    </section>
</div>
