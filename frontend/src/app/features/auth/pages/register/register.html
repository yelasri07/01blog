<form [formGroup]="registerForm" (ngSubmit)="handleSubmit()">
    {{ registerForm.controls.username.errors | json }}
    <br>
    <br>
    <input formControlName="username" type="text" placeholder="username">
    @if (getUsername().invalid && (getUsername().touched || getUsername().dirty)) {
        @if (getUsername().hasError('required')) {
            <p style="color: red;">Invalid username</p>
        }
    }
    <br>
    <br>
    <input formControlName="email" type="email" placeholder="email">
    <br>
    <br>
    <input formControlName="password" type="password" placeholder="password">
    <br>
    <br>
    <input type="submit">
    <br>
    <br>
    <a routerLink="/auth/login">Login</a>
</form>
