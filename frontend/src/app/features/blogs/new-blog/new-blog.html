<section class="create-blog">
    <form [formGroup]="blogForm">
        <div class="header d-flex align-items-center gap-2 mb-3">
            <button (click)="handleSubmit()" class="btn btn-success" type="submit">
                <div class="d-flex align-items-center gap-2 justify-content-center">
                    Save
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-bookmark-plus" viewBox="0 0 16 16">
                        <path
                            d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1z" />
                        <path
                            d="M8 4a.5.5 0 0 1 .5.5V6H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V7H6a.5.5 0 0 1 0-1h1.5V4.5A.5.5 0 0 1 8 4" />
                    </svg>
                </div>
            </button>
            <button class="result btn" (click)="blogResult()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-journals" viewBox="0 0 16 16">
                    <path
                        d="M5 0h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2 2 2 0 0 1-2 2H3a2 2 0 0 1-2-2h1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1H1a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v9a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1H3a2 2 0 0 1 2-2" />
                    <path
                        d="M1 6v-.5a.5.5 0 0 1 1 0V6h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V9h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 2.5v.5H.5a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1H2v-.5a.5.5 0 0 0-1 0" />
                </svg>
            </button>
            <input (change)="uploadFile($event)" formControlName="file" type="file">
        </div>
        <input (input)="handleTextareaChange($event)" formControlName="title" type="text" placeholder="Title..."
            class="title w-100 border-start border-4 border-dark mb-4">
        <!-- <textarea (input)="handleTextareaChange($event)" #textarea formControlName="content"
            class="content w-100 border-start border-4" placeholder="Write your article here..."></textarea> -->
        <div #inputContent
            (input)="handleTextareaChange($event)" contenteditable="plaintext-only"
            class="content w-100 border-start border-4"
            data-placeholder="Write your article here...">
        </div>
    </form>
</section>

@if (show()) {
<section class="show-result">
    <h2> {{ resultTitle() }} </h2>
    <markdown [data]="resultContent()">

    </markdown>
</section>
}
